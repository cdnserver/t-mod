services:
  tmod-discord-bot:
    build: .
    image: tmod-discord-bot:latest
    container_name: tmod-discord-bot
    restart: unless-stopped
    env_file:
      - "C:/Users/Admin/Documents/SGLDiscordBot/.env"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - "C:/Users/Admin/Documents/SGLDiscordBot:/app/persistent"
      - "C:/Users/Admin/Documents/SGLDiscordBot/data:/app/data"
      - "C:/Users/Admin/Documents/SGLDiscordBot/secrets/minecraft-rcon-password.txt:/run/secrets/minecraft_rcon_password:ro"
      - "C:/Users/Admin/Documents/SGLDiscordBot/secrets/minecraft-supervisor-token.txt:/run/secrets/minecraft_supervisor_token:ro"
    networks:
      - default
      - minecraft-control
    depends_on:
      minecraft-supervisor:
        condition: service_healthy

  tmod-caddy:
    image: caddy:2.10.2-alpine
    container_name: tmod-caddy
    restart: unless-stopped
    depends_on:
      - tmod-discord-bot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "C:/Users/Admin/Documents/SGLDiscordBot/caddy/data:/data"
      - "C:/Users/Admin/Documents/SGLDiscordBot/caddy/config:/config"

  minecraft:
    image: itzg/minecraft-server:java25-jdk
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.1.2"
      PAPER_BUILD: "74"
      MEMORY: "4G"
      TZ: "Europe/Riga"
      MOTD: "mc.tvr.lat | By Alexey Neblagodarniy Ueban (Scammer)"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD_FILE: "/run/secrets/minecraft_rcon_password"
      OVERRIDE_SERVER_PROPERTIES: "false"
    volumes:
      - "C:/Users/Admin/Documents/SGLDiscordBot/minecraft:/data"
      - "C:/Users/Admin/Documents/SGLDiscordBot/secrets/minecraft-rcon-password.txt:/run/secrets/minecraft_rcon_password:ro"
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 90s

  minecraft-supervisor:
    build:
      context: ./minecraft-supervisor
    image: tmod-minecraft-supervisor:latest
    container_name: minecraft-supervisor
    restart: unless-stopped
    environment:
      MINECRAFT_CONTAINER_NAME: "minecraft"
      MINECRAFT_SUPERVISOR_TOKEN_FILE: "/run/secrets/minecraft_supervisor_token"
    expose:
      - "8791"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "C:/Users/Admin/Documents/SGLDiscordBot/secrets/minecraft-supervisor-token.txt:/run/secrets/minecraft_supervisor_token:ro"
    networks:
      - minecraft-control
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/health', timeout=2)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  discord-browser-stream:
    profiles:
      - browser-stream
    build:
      context: ./discord-browser-stream
    image: tmod-browser-stream:latest
    container_name: discord-browser-stream
    restart: unless-stopped
    env_file:
      - "C:/Users/Admin/Documents/SGLDiscordBot/.env"
      - "C:/Users/Admin/Documents/SGLDiscordBot/browser-stream.env"
    expose:
      - "8790"
    volumes:
      - "C:/Users/Admin/Documents/SGLDiscordBot/browser-stream:/data"
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  default:
  minecraft-control:
    internal: true
