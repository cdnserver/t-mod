services:
  tmod-discord-bot:
    build: .
    image: tmod-discord-bot:latest
    container_name: tmod-discord-bot
    restart: unless-stopped
    # Docker Desktop exposes Windows NTFS bind mounts as root-owned. The image
    # stays non-root by default, while this Windows deployment override keeps
    # SQLite and persistent output writable.
    user: "0:0"
    env_file:
      - "C:/Users/Admin/Documents/SGLDiscordBot/.env"
    environment:
      TMOD_RELEASE: "${TMOD_RELEASE:-unknown}"
      ATLAS_QDRANT_URL: "http://atlas-qdrant:6333"
      ATLAS_FORUM_SELENIUM_URL: "http://atlas-forum-browser:4444/wd/hub"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - "C:/Users/Admin/Documents/SGLDiscordBot:/app/persistent"
      - "C:/Users/Admin/Documents/SGLDiscordBot/data:/app/data"
      - "C:/Users/Admin/Documents/SGLDiscordBot/secrets/minecraft-rcon-password.txt:/run/secrets/minecraft_rcon_password:ro"
      - "C:/Users/Admin/Documents/SGLDiscordBot/secrets/minecraft-supervisor-token.txt:/run/secrets/minecraft_supervisor_token:ro"
    networks:
      - default
      - minecraft-control
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=2)"
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 90s

  atlas-qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: tmod-atlas-qdrant
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      # Qdrant mmap storage must live on a POSIX-compatible Docker volume.
      # Windows bind mounts can corrupt Gridstore payload pages.
      - "atlas-qdrant-data:/qdrant/storage"
    environment:
      QDRANT__SERVICE__ENABLE_CORS: "false"
    security_opt:
      - no-new-privileges:true

  atlas-forum-browser-init:
    image: alpine:3.22
    container_name: tmod-atlas-forum-browser-init
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /profile/atlas && chown -R 1200:1201 /profile"]
    volumes:
      - "atlas-forum-browser-data:/profile"

  atlas-forum-browser:
    image: selenium/standalone-chromium:4.46.0-20260707
    container_name: tmod-atlas-forum-browser
    restart: unless-stopped
    shm_size: "2gb"
    expose:
      - "4444"
    ports:
      # Manual forum verification is reachable only from the home server.
      - "127.0.0.1:7900:7900"
    depends_on:
      atlas-forum-browser-init:
        condition: service_completed_successfully
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "false"
      SE_NODE_SESSION_TIMEOUT: "86400"
      SE_SESSION_REQUEST_TIMEOUT: "60"
      # noVNC is bound to host loopback only, so a second password is unnecessary.
      SE_VNC_NO_PASSWORD: "true"
    volumes:
      - "atlas-forum-browser-data:/home/seluser/.config/chromium"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:4444/status
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 35s

  tmod-caddy:
    image: caddy:2.10.2-alpine
    container_name: tmod-caddy
    restart: unless-stopped
    depends_on:
      tmod-discord-bot:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./web/consensus:/srv/tmod:ro"
      - "C:/Users/Admin/Documents/SGLDiscordBot/caddy/data:/data"
      - "C:/Users/Admin/Documents/SGLDiscordBot/caddy/config:/config"

  minecraft:
    image: itzg/minecraft-server:java25-jdk
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.1.2"
      PAPER_BUILD: "74"
      MEMORY: "4G"
      TZ: "Europe/Riga"
      MOTD: "T-Mod • mc.tvr.lat • Товарищество"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD_FILE: "/run/secrets/minecraft_rcon_password"
      # Keep explicitly managed values (including the secret-file backed RCON
      # password) synchronized while preserving properties without env values.
      OVERRIDE_SERVER_PROPERTIES: "true"
    volumes:
      - "C:/Users/Admin/Documents/SGLDiscordBot/minecraft:/data"
      - "C:/Users/Admin/Documents/SGLDiscordBot/secrets/minecraft-rcon-password.txt:/run/secrets/minecraft_rcon_password:ro"
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 90s

  minecraft-supervisor:
    build:
      context: ./minecraft-supervisor
    image: tmod-minecraft-supervisor:latest
    container_name: minecraft-supervisor
    restart: unless-stopped
    environment:
      MINECRAFT_CONTAINER_NAME: "minecraft"
      MINECRAFT_SUPERVISOR_TOKEN_FILE: "/run/secrets/minecraft_supervisor_token"
      MINECRAFT_STOP_GRACE_SECONDS: "10"
    expose:
      - "8791"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "C:/Users/Admin/Documents/SGLDiscordBot/secrets/minecraft-supervisor-token.txt:/run/secrets/minecraft_supervisor_token:ro"
    networks:
      - minecraft-control
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/health', timeout=2)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  default:
  minecraft-control:
    internal: true

volumes:
  atlas-qdrant-data:
    name: tmod-atlas-qdrant-data
  atlas-forum-browser-data:
    name: tmod-atlas-forum-browser-data
