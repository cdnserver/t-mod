services:
  tmod-discord-bot:
    build: .
    image: tmod-discord-bot:latest
    container_name: tmod-discord-bot
    restart: unless-stopped
    env_file:
      - "C:/Users/Admin/Documents/SGLDiscordBot/.env"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - "C:/Users/Admin/Documents/SGLDiscordBot:/app/persistent"
      - "C:/Users/Admin/Documents/SGLDiscordBot/data:/app/data"

  tmod-caddy:
    image: caddy:2.10.2-alpine
    container_name: tmod-caddy
    restart: unless-stopped
    depends_on:
      - tmod-discord-bot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "C:/Users/Admin/Documents/SGLDiscordBot/caddy/data:/data"
      - "C:/Users/Admin/Documents/SGLDiscordBot/caddy/config:/config"

  discord-browser-stream:
    profiles:
      - browser-stream
    build:
      context: ./discord-browser-stream
    image: tmod-browser-stream:latest
    container_name: discord-browser-stream
    restart: unless-stopped
    env_file:
      - "C:/Users/Admin/Documents/SGLDiscordBot/.env"
      - "C:/Users/Admin/Documents/SGLDiscordBot/browser-stream.env"
    expose:
      - "8790"
    volumes:
      - "C:/Users/Admin/Documents/SGLDiscordBot/browser-stream:/data"
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
