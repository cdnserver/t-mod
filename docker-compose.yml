services:
  tmod-discord-bot:
    build: .
    image: tmod-discord-bot:latest
    container_name: tmod-discord-bot
    restart: unless-stopped
    env_file:
      - "C:/Users/Admin/Documents/SGLDiscordBot/.env"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - "C:/Users/Admin/Documents/SGLDiscordBot:/app/persistent"
      - "C:/Users/Admin/Documents/SGLDiscordBot/data:/app/data"

  tmod-caddy:
    image: caddy:2.10.2-alpine
    container_name: tmod-caddy
    restart: unless-stopped
    depends_on:
      - tmod-discord-bot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "C:/Users/Admin/Documents/SGLDiscordBot/caddy/data:/data"
      - "C:/Users/Admin/Documents/SGLDiscordBot/caddy/config:/config"
