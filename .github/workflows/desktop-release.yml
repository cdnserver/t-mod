name: T-Mod Desktop release

on:
  push:
    branches:
      - main
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Версия исходного кода, например desktop-v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare-release:
    name: Prepare public release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
      RELEASE_REPOSITORY: cdnserver/t-mod-releases
    steps:
      - name: Create release shell
        shell: bash
        run: |
          test -n "$GH_TOKEN" || { echo "DESKTOP_RELEASE_TOKEN is missing"; exit 1; }
          version="${RELEASE_TAG#desktop-v}"
          target_tag="v${version}"
          release_flags=(--latest)
          if [[ "$version" == *-dev.* ]]; then
            release_flags=(--prerelease)
          fi
          if gh release view "$target_tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$target_tag" --repo "$RELEASE_REPOSITORY" "${release_flags[@]}"
          else
            gh release create "$target_tag" \
              --repo "$RELEASE_REPOSITORY" \
              --title "T-Mod Desktop ${version}" \
              --notes "Установщики T-Mod Desktop ${version}. Приложение получает дальнейшие обновления автоматически." \
              "${release_flags[@]}"
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: electron-builder --win nsis --x64 --publish never
            artifact: desktop-windows
            files: |
              desktop/release/*.exe
              desktop/release/*.exe.blockmap
              desktop/release/latest*.yml
              desktop/release/dev*.yml
          - name: macOS universal
            os: macos-latest
            command: electron-builder --mac dmg zip --universal --publish never
            artifact: desktop-macos
            files: |
              desktop/release/*.dmg
              desktop/release/*.zip
              desktop/release/*.blockmap
              desktop/release/latest*.yml
              desktop/release/dev*.yml
          - name: Linux x64
            os: ubuntu-latest
            command: electron-builder --linux AppImage --x64 --publish never
            artifact: desktop-linux
            files: |
              desktop/release/*.AppImage
              desktop/release/*.AppImage.blockmap
              desktop/release/latest*.yml
              desktop/release/dev*.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: node -e "const p=require('./desktop/package.json'); const expected='desktop-v'+p.version; if(process.env.RELEASE_TAG!==expected){console.error('Expected tag '+expected+', got '+process.env.RELEASE_TAG); process.exit(1)}"

      - name: Configure update channel
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const channel = pkg.version.includes('-dev.') ? 'dev' : 'latest';
          pkg.build.publish = pkg.build.publish.map((provider) => ({ ...provider, channel }));
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(`Update channel: ${channel}`);
          NODE

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Test and compile
        working-directory: desktop
        run: |
          pnpm test
          pnpm typecheck
          pnpm build
          pnpm check:bundle

      - name: Build installer
        working-directory: desktop
        run: pnpm exec ${{ matrix.command }}

      - name: Publish platform installers
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: cdnserver/t-mod-releases
        run: |
          test -n "$GH_TOKEN" || { echo "DESKTOP_RELEASE_TOKEN is missing"; exit 1; }
          version="${RELEASE_TAG#desktop-v}"
          target_tag="v${version}"
          shopt -s nullglob
          case "${{ runner.os }}" in
            Windows) files=(desktop/release/*.exe desktop/release/*.exe.blockmap desktop/release/latest*.yml desktop/release/dev*.yml) ;;
            macOS) files=(desktop/release/*.dmg desktop/release/*.zip desktop/release/*.blockmap desktop/release/latest*.yml desktop/release/dev*.yml) ;;
            Linux) files=(desktop/release/*.AppImage desktop/release/*.AppImage.blockmap desktop/release/latest*.yml desktop/release/dev*.yml) ;;
          esac
          ((${#files[@]})) || { echo "No installer files were produced"; exit 1; }
          gh release upload "$target_tag" "${files[@]}" --repo "$RELEASE_REPOSITORY" --clobber
