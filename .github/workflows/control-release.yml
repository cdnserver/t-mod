name: Publish T-Mod Control

on:
  workflow_dispatch:
  push:
    tags: ["control-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Build native release
        shell: pwsh
        run: |
          python scripts/build_tmod_windows_bundles.py
          dotnet publish control-center/TMod.Control/TMod.Control.csproj -c Release -r win-x64 --self-contained true -o control-center/publish --nologo
          $files = @(Get-ChildItem control-center/publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'T-Mod-Control.exe') { throw 'Expected exactly one release EXE' }
          & $files[0].FullName --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native self-test failed' }
          $manifest = Get-Content tmod_control_version.json -Raw | ConvertFrom-Json
          $actualHash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $manifest.sha256 -or $files[0].Length -ne [long]$manifest.size_bytes) { throw 'Release does not match signed manifest' }
          "CONTROL_TAG=control-v$($manifest.version)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish immutable release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
        run: |
          $repo = 'cdnserver/t-mod-releases'
          gh release view $env:CONTROL_TAG --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:CONTROL_TAG control-center/publish/T-Mod-Control.exe --repo $repo --clobber
          } else {
            gh release create $env:CONTROL_TAG control-center/publish/T-Mod-Control.exe --repo $repo --title "T-Mod Control $env:CONTROL_TAG" --notes "Нативный самодостаточный пульт управления T-Mod для Windows."
          }
