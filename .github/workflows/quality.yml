name: T-Mod quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 · compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DATA_DIR: ${{ runner.temp }}/tmod-data
      DATABASE_FILE: ${{ runner.temp }}/tmod-data/tmod.db
      DISCORD_TOKEN: test-token-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile production and tests
        run: python -m compileall -q main.py storage.py localization.py modules tests

      - name: Import composition root
        run: python -c "import main; assert main.bot.tree.get_commands()"

      - name: Run unit, contract and architecture tests
        run: python -m unittest discover -s tests -v
