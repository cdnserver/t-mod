name: T-Mod quality

on:
  push:
    branches: [main, dev, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Production container · build and runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --pull --tag tmod-production:test .

      - name: Verify split runtime and PostgreSQL tools
        run: |
          docker run --rm --entrypoint python tmod-production:test -c "import web_gateway, worker_main"
          docker run --rm --entrypoint sh tmod-production:test -c 'pg_dump --version | grep -F "PostgreSQL) 17." && pg_restore --version | grep -F "PostgreSQL) 17."'

  control-center:
    name: Native Control Center · build and self-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Generate embedded backend
        run: python scripts/build_tmod_windows_bundles.py

      - name: Build and run native self-test
        shell: pwsh
        run: |
          dotnet build control-center/TMod.Control/TMod.Control.csproj -c Release --nologo
          dotnet run --project control-center/TMod.Control/TMod.Control.csproj -c Release --no-build -- --self-test

      - name: Publish one self-contained Windows EXE
        shell: pwsh
        run: |
          dotnet publish control-center/TMod.Control/TMod.Control.csproj -c Release -r win-x64 --self-contained true -o control-center/publish --nologo
          $files = @(Get-ChildItem control-center/publish -File)
          if ($files.Count -ne 1 -or $files[0].Extension -ne '.exe') { throw 'Expected exactly one EXE' }

  test:
    name: Python 3.12 · security, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DISCORD_TOKEN: test-token-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure isolated test storage
        shell: bash
        run: |
          echo "DATA_DIR=$RUNNER_TEMP/tmod-data" >> "$GITHUB_ENV"
          echo "DATABASE_FILE=$RUNNER_TEMP/tmod-data/tmod.db" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js for browser asset validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip>=26.1.2"
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check "ruff==0.15.22" "pip-audit==2.10.1"

      - name: Validate dependency graph and known vulnerabilities
        run: |
          python -m pip check
          # discord.py 2.7.1 intentionally pins PyNaCl <1.6. The advisory is
          # limited to a custom Ed25519 point-validation primitive that T-Mod
          # does not use; overriding the upstream pin would break voice support.
          python -m pip_audit --local --progress-spinner off --ignore-vuln CVE-2025-69277

      - name: Compile production and tests
        run: python -m compileall -q main.py web_gateway.py worker_main.py storage.py localization.py modules persistence scripts minecraft-supervisor tests

      - name: Lint Python
        run: python -m ruff check .

      - name: Validate browser JavaScript syntax
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Import composition root
        run: python -c "import main; assert main.bot.tree.get_commands()"

      - name: Run unit, contract and architecture tests
        run: python -m unittest discover -s tests -v

  postgres:
    name: PostgreSQL 17 · schema and SQLite migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tmod_ci
          POSTGRES_USER: tmod
          POSTGRES_PASSWORD: tmod-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tmod -d tmod_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TMOD_POSTGRES_INTEGRATION: "1"
      TMOD_DATABASE_BACKEND: postgresql
      DATABASE_URL: postgresql://tmod:tmod-ci-password@127.0.0.1:5432/tmod_ci
      DISCORD_TOKEN: test-token-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate schema, repositories and lossless SQLite import
        run: python scripts/postgres_integration_test.py
