name: T-Mod quality

on:
  push:
    branches: [main, dev, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 · security, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DISCORD_TOKEN: test-token-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure isolated test storage
        shell: bash
        run: |
          echo "DATA_DIR=$RUNNER_TEMP/tmod-data" >> "$GITHUB_ENV"
          echo "DATABASE_FILE=$RUNNER_TEMP/tmod-data/tmod.db" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js for browser asset validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip>=26.1.2"
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check "ruff==0.15.22" "pip-audit==2.10.1"

      - name: Validate dependency graph and known vulnerabilities
        run: |
          python -m pip check
          # discord.py 2.7.1 intentionally pins PyNaCl <1.6. The advisory is
          # limited to a custom Ed25519 point-validation primitive that T-Mod
          # does not use; overriding the upstream pin would break voice support.
          python -m pip_audit --local --progress-spinner off --ignore-vuln CVE-2025-69277

      - name: Compile production and tests
        run: python -m compileall -q main.py storage.py localization.py modules persistence scripts minecraft-supervisor tests

      - name: Lint Python
        run: python -m ruff check .

      - name: Validate browser JavaScript syntax
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Import composition root
        run: python -c "import main; assert main.bot.tree.get_commands()"

      - name: Run unit, contract and architecture tests
        run: python -m unittest discover -s tests -v
