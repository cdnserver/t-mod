<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#080a08">
    <meta
      name="description"
      content="Специальный экран прямой демонстрации T-Mod."
    >
    <title>T-Mod — демонстрация</title>
    <link rel="stylesheet" href="/assets/egg.css">
  </head>
  <body>
    <main class="egg-screen">
      <div class="ambient ambient-left" aria-hidden="true"></div>
      <div class="ambient ambient-right" aria-hidden="true"></div>
      <div class="grid" aria-hidden="true"></div>

      <header class="live-status">
        <span class="live-dot" aria-hidden="true"></span>
        <span>БОТ ПОКАЗЫВАЕТ ДЕМКУ</span>
      </header>

      <section class="announcement" aria-labelledby="egg-title">
        <p class="eyebrow">T·MOD SPECIAL BROADCAST</p>
        <h1 id="egg-title">
          <span>{{EGG_NAME}}</span>
          <span>ОФИЦИАЛЬНО ВЫВАЛИЛ</span>
          <strong>ЯЙЦА НА СТОЛ</strong>
        </h1>
      </section>

      <footer>
        <span>TVRS NETWORK</span>
        <span class="signal">СИГНАЛ СТАБИЛЕН</span>
      </footer>
    </main>
  </body>
</html>
