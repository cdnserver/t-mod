<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#080a08">
    <meta
      name="description"
      content="Специальный музыкальный экран прямой демонстрации T-Mod."
    >
    <title>Зигмунд Правосудов — специальная трансляция T-Mod</title>
    <link rel="stylesheet" href="/assets/egg.css">
  </head>
  <body>
    <main class="egg-screen">
      <div class="ambient ambient-left" aria-hidden="true"></div>
      <div class="ambient ambient-right" aria-hidden="true"></div>
      <div class="grid" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="impact" aria-hidden="true"></div>
      <div class="rings" aria-hidden="true"></div>
      <div class="particles" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
        <i></i><i></i><i></i><i></i>
      </div>

      <header class="live-status">
        <span class="live-dot" aria-hidden="true"></span>
        <span>БОТ ПОКАЗЫВАЕТ ДЕМКУ</span>
      </header>

      <section class="announcement" aria-labelledby="egg-title">
        <p class="eyebrow">T·MOD SPECIAL BROADCAST</p>
        <h1 id="egg-title">
          <span class="subject">ЗИГМУНД ПРАВОСУДОВ</span>
          <span class="action">ОФИЦИАЛЬНО ВЫВАЛИЛ</span>
          <strong class="verdict">ЯЙЦА НА СТОЛ</strong>
        </h1>
        <div class="now-playing" aria-label="Сейчас играет: Зигмунд и Мурчалки">
          <span class="equalizer" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </span>
          <span>ЗИГМУНД И МУРЧАЛКИ</span>
        </div>
      </section>

      <footer>
        <span>TVRS NETWORK</span>
        <span class="signal">СИГНАЛ СТАБИЛЕН</span>
      </footer>

      <button class="sound-gate" type="button" hidden>
        <span aria-hidden="true">▶</span>
        ВКЛЮЧИТЬ ЗВУК
      </button>

      <audio
        id="egg-audio"
        src="/assets/zigmund-murchalki.mp3"
        preload="auto"
        autoplay
        loop
        playsinline
      ></audio>
    </main>
    <script type="module" src="/assets/egg.js"></script>
  </body>
</html>
