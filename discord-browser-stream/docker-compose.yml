services:
  discord-browser-stream:
    build:
      context: .
    container_name: discord-browser-stream
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8790"
    volumes:
      - ./data:/data
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
